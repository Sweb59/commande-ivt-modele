<script>
    /* ==================================================================
       ÉTAT ET PERSISTANCE
       ================================================================== */
    /* Version de l'application :
       null            -> version clinique (Dr Karkoutly, Dr Laffineur, ...)
       tableau de noms -> version modèle (Médecin 1, Médecin 2, ...) : base vierge
                          de médecins, à configurer par l'utilisateur.

       Les deux applications étant servies depuis la même origine
       (sweb59.github.io), elles partageraient sinon le même localStorage :
       chaque version utilise donc ses propres clés de stockage.            */
    const VERSION_MODELE = ['Médecin 1', 'Médecin 2', 'Médecin 3', 'Médecin 4', 'Médecin 5'];

    const SUFFIXE_STOCKAGE = Array.isArray(VERSION_MODELE) ? '_modele' : '';
    const CLE_CONFIG = 'configIVT_HPVA' + SUFFIXE_STOCKAGE;
    const CLE_SAISIE = 'saisieIVT_HPVA' + SUFFIXE_STOCKAGE;

    /* Version de CE fichier (doit correspondre à CACHE dans sw.js) */
    const VERSION_APPLI = 'commande-ivt-v14';

    const FAMILLES_DEFAUT = ["Médicaments & Solutés", "Aiguilles & Seringues", "Gants Stériles", "Consommables & Sets"];
    const UNITES_DEFAUT = ["boîte", "unité", "carton", "lot"];

    let config = null;
    let compteursIVT = {};
    let indexMedecinActuel = 0;
    let modeCorrection = false;
    let donneesCommandeFinale = [];

    let vueCourante = 'saisie';
    let vueAvantParam = 'saisie';
    let sectionParam = 'medecins';
    let formActif = null;          /* {type, id/uid} */
    let medecinSelectionne = null; /* id du médecin (section "par médecin") */

    function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

    function slug(nom) {
        return (nom || '').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
            .replace(/[^a-z0-9]+/g, '').slice(0, 24) || 'medecin';
    }

    const COULEURS_MEDECINS = ['#7E57C2', '#E53935', '#1E88E5', '#8E24AA', '#F57F17', '#00897B', '#AD1457'];

    function medecinsParDefaut() {
        if (Array.isArray(VERSION_MODELE)) {
            return VERSION_MODELE.map((nom, i) => ({
                id: 'medecin' + (i + 1),
                nom: nom,
                couleur: COULEURS_MEDECINS[i % COULEURS_MEDECINS.length]
            }));
        }
        return [
            { id: 'karkoutly', nom: 'Dr Karkoutly', couleur: '#7E57C2' },
            { id: 'laffineur', nom: 'Dr Laffineur', couleur: '#E53935' },
            { id: 'doucet', nom: 'Dr Doucet', couleur: '#1E88E5' },
            { id: 'richet', nom: 'Dr Richet', couleur: '#8E24AA' },
            { id: 'buisset', nom: 'Dr Buisset', couleur: '#F57F17' }
        ];
    }

    function catalogueParDefaut() {
        return [
            { nom: "Bétadine Opht 20ml", ref: "1548498", qte: 2, famille: "Médicaments & Solutés", cond: 20, unite: "boîte", fixe: true },
            { nom: "Aiguilles Jaunes", ref: "1078380", qte: 1, famille: "Aiguilles & Seringues", cond: 100, unite: "boîte" },
            { nom: "Sets IVT", ref: "1640668", qte: 1, famille: "Consommables & Sets", cond: 76, unite: "carton" },
            { nom: "Badigeons", ref: "1534736", qte: 1, famille: "Consommables & Sets", cond: 40, unite: "boîte" },
            { nom: "Sterdex Unidose", ref: "1015711", qte: 1, famille: "Médicaments & Solutés", cond: 12, unite: "boîte" },
            { nom: "Tétracaïne 1% 0.4ml", ref: "1017413", qte: 1, famille: "Médicaments & Solutés", cond: 100, unite: "boîte" },
            { nom: "Aiguilles Roses 18G", ref: "1053188", qte: 1, famille: "Aiguilles & Seringues", cond: 100, unite: "boîte" },
            { nom: "Seringues de 20ml Luer Lock", ref: "1078408", qte: 1, famille: "Aiguilles & Seringues", cond: 100, unite: "boîte" },
            { nom: "Feutres dermographiques", ref: "1633514", qte: 1, famille: "Consommables & Sets", cond: 50, unite: "boîte" },
            { nom: "Microsponges", ref: "1118761", qte: 1, famille: "Consommables & Sets", cond: 25, unite: "boîte" },
            { nom: "Gants Stériles 6.5", ref: "1558699", qte: 1, famille: "Gants Stériles", cond: 50, unite: "boîte" },
            { nom: "Gants Stériles 7.5", ref: "1558701", qte: 1, famille: "Gants Stériles", cond: 50, unite: "boîte" },
            { nom: "Gants Stériles 8", ref: "1558702", qte: 1, famille: "Gants Stériles", cond: 50, unite: "boîte" },
            { nom: "Gants Stériles 8.5", ref: "1558703", qte: 1, famille: "Gants Stériles", cond: 50, unite: "boîte" },
            { nom: "Quinofree 0.3% 0.5ml", ref: "1532136", qte: 1, famille: "Médicaments & Solutés", cond: 20, unite: "boîte" },
            { nom: "BSS Poche 500ml", ref: "1018394", qte: 1, famille: "Médicaments & Solutés", cond: 6, unite: "carton", fixe: true },
            { nom: "Na Cl 0.9%", ref: "1541039", qte: 1, famille: "Médicaments & Solutés", cond: 20, unite: "boîte" }
        ];
    }

    function configParDefaut() {
        return {
            medecins: medecinsParDefaut(),
            materielCatalogue: catalogueParDefaut(),
            materielBase: [
                { nom: "Bétadine Opht 20ml", ref: "1548498", qte: 2, famille: "Médicaments & Solutés", cond: 20, unite: "boîte", fixe: true },
                { nom: "Aiguilles Jaunes", ref: "1078380", qte: 1, famille: "Aiguilles & Seringues", cond: 100, unite: "boîte" },
                { nom: "Sets IVT", ref: "1640668", qte: 1, famille: "Consommables & Sets", cond: 76, unite: "carton" },
                { nom: "Badigeons", ref: "1534736", qte: 1, famille: "Consommables & Sets", cond: 40, unite: "boîte" },
                { nom: "Sterdex Unidose", ref: "1015711", qte: 1, famille: "Médicaments & Solutés", cond: 12, unite: "boîte" },
                { nom: "Tétracaïne 1% 0.4ml", ref: "1017413", qte: 1, famille: "Médicaments & Solutés", cond: 100, unite: "boîte" }
            ],
            materielSpecifique: Array.isArray(VERSION_MODELE) ? {} : {
                'karkoutly': [
                    { nom: "Aiguilles Roses 18G", ref: "1053188", qte: 1, famille: "Aiguilles & Seringues", cond: 100, unite: "boîte" },
                    { nom: "Feutres dermographiques", ref: "1633514", qte: 1, famille: "Consommables & Sets", cond: 50, unite: "boîte" },
                    { nom: "Microsponges", ref: "1118761", qte: 1, famille: "Consommables & Sets", cond: 25, unite: "boîte" },
                    { nom: "Seringues de 20ml Luer Lock", ref: "1078408", qte: 1, famille: "Aiguilles & Seringues", cond: 100, unite: "boîte" },
                    { nom: "Gants Stériles 6.5", ref: "1558699", qte: 1, famille: "Gants Stériles", cond: 50, unite: "boîte" },
                    { nom: "Quinofree 0.3% 0.5ml", ref: "1532136", qte: 1, famille: "Médicaments & Solutés", cond: 20, unite: "boîte" },
                    { nom: "BSS Poche 500ml", ref: "1018394", qte: 1, famille: "Médicaments & Solutés", cond: 6, unite: "carton", fixe: true }
                ],
                'laffineur': [
                    { nom: "Feutres dermographiques", ref: "1633514", qte: 1, famille: "Consommables & Sets", cond: 50, unite: "boîte" },
                    { nom: "Gants Stériles 8.5", ref: "1558703", qte: 1, famille: "Gants Stériles", cond: 50, unite: "boîte" },
                    { nom: "Na Cl 0.9%", ref: "1541039", qte: 1, famille: "Médicaments & Solutés", cond: 20, unite: "boîte" }
                ],
                'doucet': [
                    { nom: "Aiguilles Roses 18G", ref: "1053188", qte: 1, famille: "Aiguilles & Seringues", cond: 100, unite: "boîte" },
                    { nom: "Feutres dermographiques", ref: "1633514", qte: 1, famille: "Consommables & Sets", cond: 50, unite: "boîte" },
                    { nom: "Microsponges", ref: "1118761", qte: 1, famille: "Consommables & Sets", cond: 25, unite: "boîte" },
                    { nom: "Seringues de 20ml Luer Lock", ref: "1078408", qte: 1, famille: "Aiguilles & Seringues", cond: 100, unite: "boîte" },
                    { nom: "Gants Stériles 8", ref: "1558702", qte: 1, famille: "Gants Stériles", cond: 50, unite: "boîte" },
                    { nom: "Quinofree 0.3% 0.5ml", ref: "1532136", qte: 1, famille: "Médicaments & Solutés", cond: 20, unite: "boîte" },
                    { nom: "BSS Poche 500ml", ref: "1018394", qte: 1, famille: "Médicaments & Solutés", cond: 6, unite: "carton", fixe: true }
                ],
                'richet': [
                    { nom: "Gants Stériles 7.5", ref: "1558701", qte: 1, famille: "Gants Stériles", cond: 50, unite: "boîte" },
                    { nom: "Na Cl 0.9%", ref: "1541039", qte: 1, famille: "Médicaments & Solutés", cond: 20, unite: "boîte" },
                    { nom: "Quinofree 0.3% 0.5ml", ref: "1532136", qte: 1, famille: "Médicaments & Solutés", cond: 20, unite: "boîte" }
                ],
                'buisset': [
                    { nom: "Gants Stériles 7.5", ref: "1558701", qte: 1, famille: "Gants Stériles", cond: 50, unite: "boîte" },
                    { nom: "Na Cl 0.9%", ref: "1541039", qte: 1, famille: "Médicaments & Solutés", cond: 20, unite: "boîte" }
                ]
            },
            materielAVerifier: [
                { nom: "Alézes à Usage Unique (4 Sachets)", ref: "1637526" },
                { nom: "Absorbex 40 x 60 (3 Paquets)", ref: "1254587" },
                { nom: "Trocards avec filtre BD (une vingtaine)", ref: "1248956" },
                { nom: "Coques Universelles (2 Boîtes)", ref: "1149497" },
                { nom: "Compresses Ophta (2 Boîtes)", ref: "1051069" },
                { nom: "Compresses Stériles 7.5 x 7.5 (2 Boîtes)", ref: "1242287" },
                { nom: "Seringues 1ml Luer Lock (Une vingtaine)", ref: "1148318" },
                { nom: "Bétadine Dermique 500ml (4 Flacons)", ref: "1548491" },
                { nom: "Aniosgel 800 500ml (3 Flacons)", ref: "1650332" },
                { nom: "Chibro Cadron Collyre 5ml (4 Flacons)", ref: "1015400" }
            ],
            familles: FAMILLES_DEFAUT.slice(),
            unites: UNITES_DEFAUT.slice()
        };
    }

    function migrerConfig(c) {
        const def = configParDefaut();
        if (!c || typeof c !== 'object') return migrerConfig(def);
        c.medecins = Array.isArray(c.medecins) && c.medecins.length ? c.medecins : def.medecins;
        c.materielSpecifique = (c.materielSpecifique && typeof c.materielSpecifique === 'object') ? c.materielSpecifique : {};
        c.materielCatalogue = (Array.isArray(c.materielCatalogue) && c.materielCatalogue.length) ? c.materielCatalogue : def.materielCatalogue;
        c.materielAVerifier = Array.isArray(c.materielAVerifier) ? c.materielAVerifier : def.materielAVerifier;
        c.familles = Array.isArray(c.familles) ? c.familles : [];
        c.unites = Array.isArray(c.unites) ? c.unites : [];
        /* Suggestions d'unités : les valeurs par défaut sont toujours proposées */
        c.unites = UNITES_DEFAUT.concat(c.unites.filter(u => UNITES_DEFAUT.indexOf(u) === -1));

        c.medecins.forEach(m => {
            if (!m.id) m.id = slugUnique(c.medecins, m.nom);
            if (!m.nom) m.nom = m.id;
            if (!m.couleur) m.couleur = '#0288D1';
        });

        /* Ancien "matériel commun" : reporté dans la liste complète de chaque médecin */
        if (Array.isArray(c.materielBase) && c.materielBase.length) {
            const base = c.materielBase;
            c.medecins.forEach(m => {
                const liste = Array.isArray(c.materielSpecifique[m.id]) ? c.materielSpecifique[m.id] : [];
                base.forEach(b => {
                    if (!liste.some(a => a.nom === b.nom)) liste.push(Object.assign({}, b, { uid: null }));
                });
                c.materielSpecifique[m.id] = liste;
            });
        }
        /* La clé reste présente mais vide : une ancienne version de l'application
           qui relirait cette configuration ne recréerait pas de matériel commun. */
        c.materielBase = [];

        c.medecins.forEach(m => {
            if (!Array.isArray(c.materielSpecifique[m.id])) c.materielSpecifique[m.id] = [];
        });

        const tousArticles = [].concat(...Object.values(c.materielSpecifique), c.materielCatalogue);
        tousArticles.forEach(a => {
            if (!a.uid) a.uid = uid();
            if (a.fixe === undefined) a.fixe = false;
            a.qte = (typeof a.qte === 'number') ? a.qte : (parseInt(a.qte, 10) || 0);
            a.cond = (typeof a.cond === 'number') ? a.cond : (parseInt(a.cond, 10) || 1) || 1;
            if (!a.unite) a.unite = 'boîte';
            if (!a.famille) a.famille = 'Divers';
            if (!a.ref) a.ref = '';
        });
        c.materielAVerifier.forEach(a => { if (!a.uid) a.uid = uid(); if (!a.ref) a.ref = ''; });
        return c;
    }

    function chargerConfig() {
        try {
            const brut = localStorage.getItem(CLE_CONFIG);
            if (brut) return migrerConfig(JSON.parse(brut));
        } catch (e) { /* config corrompue : on repart des valeurs par défaut */ }
        const def = migrerConfig(configParDefaut());
        try { localStorage.setItem(CLE_CONFIG, JSON.stringify(def)); } catch (e) {}
        return def;
    }

    function sauverConfig() {
        config = migrerConfig(config);
        try { localStorage.setItem(CLE_CONFIG, JSON.stringify(config)); } catch (e) { alert("Impossible d'enregistrer la configuration."); }
    }

    function chargerSaisie() {
        try {
            const brut = localStorage.getItem(CLE_SAISIE);
            if (brut) compteursIVT = JSON.parse(brut) || {};
        } catch (e) { compteursIVT = {}; }
    }
    function sauverSaisie() { try { localStorage.setItem(CLE_SAISIE, JSON.stringify(compteursIVT)); } catch (e) {} }

    /* ==================================================================
       UTILITAIRES
       ================================================================== */
    function esc(s) {
        return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, c =>
            ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function val(id) { const e = document.getElementById(id); return e ? e.value : ''; }
    function num(id) { return Math.max(0, parseInt(val(id), 10) || 0); }
    function coche(id) { const e = document.getElementById(id); return !!(e && e.checked); }

    function slugUnique(liste, nom) {
        let base = slug(nom), id = base, i = 2;
        while (liste.some(m => m.id === id)) { id = base + '-' + i; i++; }
        return id;
    }

    function ajouterFamille(f) { f = (f || '').trim(); if (f && !config.familles.includes(f)) config.familles.push(f); }
    function ajouterUnite(u) { u = (u || '').trim(); if (u && !config.unites.includes(u)) config.unites.push(u); }

    function famillesUtilisees() {
        const liste = config.familles.slice();
        Object.values(config.materielSpecifique).forEach(articles => (articles || []).forEach(a => {
            if (a.famille && !liste.includes(a.famille)) liste.push(a.famille);
        }));
        return liste;
    }

    function medecinParId(id) { return config.medecins.find(m => m.id === id) || null; }
    function articlesDuMedecin(id) { return config.materielSpecifique[id] || []; }

    /* ==================================================================
       SAISIE / RÉCAPITULATIF / COMMANDE
       ================================================================== */
    window.onload = () => {
        config = chargerConfig();
        chargerSaisie();
        indexMedecinActuel = 0;
        afficherFenetre();
    };

    function obtenirDateFichier() {
        const date = new Date();
        return `${String(date.getDate()).padStart(2, '0')}-${String(date.getMonth() + 1).padStart(2, '0')}-${date.getFullYear()}`;
    }

    function redisplay(vue) {
        if (vue === 'recap' || vue === 'correction') afficherRecapitulatif();
        else if (vue === 'commande') terminerSaisie();
        else afficherFenetre();
    }

    function afficherFenetre() {
        vueCourante = 'saisie';
        const container = document.getElementById('app-container');
        if (indexMedecinActuel >= config.medecins.length && !modeCorrection) { afficherRecapitulatif(); return; }
        const medecin = config.medecins[indexMedecinActuel];
        if (!medecin) { afficherRecapitulatif(); return; }
        const valeurSaisie = compteursIVT[medecin.id] !== undefined ? compteursIVT[medecin.id] : '';

        let boutonRetour = '';
        if (modeCorrection) {
            boutonRetour = `<button onclick="annulerCorrection()" class="btn-gris" style="flex: 1; margin-right:15px;">ANNULER</button>`;
        } else if (indexMedecinActuel > 0) {
            boutonRetour = `<button onclick="retourAuPrecedent()" class="btn-gris" style="flex: 1; margin-right:15px;">⬅ RETOUR</button>`;
        } else if (indexMedecinActuel === 0 && Object.keys(compteursIVT).length > 0) {
            boutonRetour = `<button onclick="reinitialiserSaisie()" class="btn-danger" style="flex: 1; margin-right:15px;">🔄 RÉ-INITIALISER</button>`;
        }

        container.innerHTML = `
            <div class="card">
                <h2>Nombre d'IVT réalisées</h2>
                <p>Indiquez combien d'IVT a réalisé le <br><span class="doctor-name" style="color: ${esc(medecin.couleur)};">${esc(medecin.nom)}</span> <br>dans la case ci-dessous :</p>
                <p class="instruction">
                    Ne comptez pas le nombre de patients, mais le nombre d'étiquettes de produit dans le cahier de traçabilité.
                </p>
                <input type="number" id="inputIVT" min="0" value="${esc(valeurSaisie)}" placeholder="0">
                <div style="display:flex;">
                    ${boutonRetour}
                    <button onclick="validerEtPasserAuSuivant()" style="flex: 1;">VALIDER</button>
                </div>
            </div>`;

        const inputEl = document.getElementById('inputIVT');
        inputEl.addEventListener('keypress', (e) => { if (e.key === 'Enter') validerEtPasserAuSuivant(); });
        inputEl.focus();
        setTimeout(() => { const v = inputEl.value; inputEl.value = ''; inputEl.value = v; }, 10);
    }

    function validerEtPasserAuSuivant() {
        const input = document.getElementById('inputIVT');
        const medecin = config.medecins[indexMedecinActuel];
        if (!medecin) { afficherRecapitulatif(); return; }
        compteursIVT[medecin.id] = Math.max(0, parseInt(input.value, 10) || 0);
        sauverSaisie();
        if (modeCorrection) { modeCorrection = false; indexMedecinActuel = config.medecins.length; afficherRecapitulatif(); }
        else { indexMedecinActuel++; afficherFenetre(); }
    }

    function retourAuPrecedent() { if (indexMedecinActuel > 0) { indexMedecinActuel--; afficherFenetre(); } }
    function annulerCorrection() { modeCorrection = false; indexMedecinActuel = config.medecins.length; afficherRecapitulatif(); }

    function reinitialiserSaisie() {
        if (!confirm("Ré-initialiser toutes les saisies (nombre d'IVT) ?")) return;
        compteursIVT = {};
        sauverSaisie();
        indexMedecinActuel = 0;
        modeCorrection = false;
        afficherFenetre();
    }

    function afficherRecapitulatif() {
        vueCourante = 'recap';
        modeCorrection = false;
        if (indexMedecinActuel > config.medecins.length) indexMedecinActuel = config.medecins.length;
        const container = document.getElementById('app-container');
        let listeHtml = '<ul style="list-style: none; padding: 0; margin: 0 auto 25px auto; max-width: 320px; text-align: left;">';
        config.medecins.forEach(med => {
            listeHtml += `<li style="padding: 10px 0; border-bottom: 1px solid #E1F5FE; display: flex; justify-content: space-between; align-items:center;">
                <span style="font-weight: 500; color: ${esc(med.couleur)};">${esc(med.nom)}</span><strong style="color: #0277BD; font-size: 1.1rem;">${compteursIVT[med.id] || 0} IVT</strong></li>`;
        });
        listeHtml += '</ul>';

        container.innerHTML = `
            <div class="card">
                <h2>Récapitulatif des saisies</h2>
                <p>Vérifiez les quantités avant de générer le bon de commande :</p>
                ${listeHtml}
                <div style="display:flex; flex-direction:column; gap:15px;">
                    <button onclick="terminerSaisie()">GÉNÉRER LA COMMANDE</button>
                    <button onclick="afficherMenuCorrection()" class="btn-gris">CORRIGER UNE ERREUR</button>
                </div>
            </div>`;
    }

    function afficherMenuCorrection() {
        vueCourante = 'correction';
        const container = document.getElementById('app-container');
        let boutons = '';
        config.medecins.forEach((med, index) => {
            boutons += `<button onclick="allerAuMedecin(${index})" style="margin-bottom: 10px; background-color: ${esc(med.couleur)};">${esc(med.nom)}</button>`;
        });
        container.innerHTML = `<div class="card"><h2>Corriger une saisie</h2><p>Sélectionnez le médecin :</p><div style="display:flex; flex-direction:column;">${boutons}</div><button onclick="afficherRecapitulatif()" class="btn-gris" style="margin-top: 15px;">⬅ RETOUR</button></div>`;
    }

    function allerAuMedecin(index) { modeCorrection = true; indexMedecinActuel = index; afficherFenetre(); }

    function toggleConditionnement() {
        const table = document.getElementById('table-commande');
        const btn = document.getElementById('btn-toggle-cond');
        if (!table || !btn) return;

        if (table.classList.contains('hide-cond')) {
            table.classList.remove('hide-cond');
            btn.innerHTML = '👁️ Masquer Conditionnement';
            btn.style.backgroundColor = '#78909C';
            document.querySelectorAll('.row-famille').forEach(el => el.setAttribute('colspan', '4'));
        } else {
            table.classList.add('hide-cond');
            btn.innerHTML = '👁️ Afficher Conditionnement';
            btn.style.backgroundColor = '#0288D1';
            document.querySelectorAll('.row-famille').forEach(el => el.setAttribute('colspan', '3'));
        }
    }

    function terminerSaisie() {
        vueCourante = 'commande';
        const container = document.getElementById('app-container');
        let commandeFinale = {};
        donneesCommandeFinale = [];
        const dateAffichage = new Date().toLocaleDateString('fr-FR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

        config.medecins.forEach(med => {
            const nbIVT = compteursIVT[med.id] || 0;
            if (nbIVT === 0) return;

            articlesDuMedecin(med.id).forEach(item => {
                if (!commandeFinale[item.nom]) commandeFinale[item.nom] = { ref: item.ref, qteTotal: 0, famille: item.famille, cond: item.cond, unite: item.unite };
                commandeFinale[item.nom].qteTotal += item.fixe ? item.qte : (item.qte * nbIVT);
            });
        });

        let lignes = "";
        famillesUtilisees().forEach(f => {
            let produits = Object.entries(commandeFinale).filter(([n, d]) => d.famille === f).sort((a, b) => a[0].localeCompare(b[0]));
            if (produits.length > 0) {
                lignes += `<tr style="background:#E1F5FE"><td class="row-famille" colspan="3" style="text-align:left; font-weight:bold; color:#0277BD; padding:10px 15px;">📁 ${esc(f)}</td></tr>`;
                produits.forEach(([nom, data]) => {
                    let nbBoites = Math.ceil(data.qteTotal / (data.cond || 1));
                    let libelleUnite = data.unite || 'boîte';
                    if (nbBoites > 1) {
                        if (libelleUnite === 'boîte') libelleUnite = 'boîtes';
                        else if (libelleUnite === 'carton') libelleUnite = 'cartons';
                        else if (libelleUnite === 'lot') libelleUnite = 'lots';
                        else if (libelleUnite === 'unité') libelleUnite = 'unités';
                    }
                    let texteConditionnement = `${nbBoites} ${libelleUnite}`;
                    donneesCommandeFinale.push({ famille: f, nom: nom, ref: data.ref, qteTotal: data.qteTotal, conditionnement: texteConditionnement });

                    lignes += `<tr>
                        <td data-label="Produit :" style="text-align:left; font-weight:bold; padding-left:25px;">${esc(nom)}</td>
                        <td data-label="Référence :">${esc(data.ref)}</td>
                        <td data-label="Quantité :" style="font-weight:bold;">${data.qteTotal}</td>
                        <td data-label="Conditionnement :" class="col-cond" style="color:#0288D1; font-weight:bold;">${esc(texteConditionnement)} <br><span style="font-size:0.75rem; font-weight:normal; color:#78909C;">(par ${data.cond})</span></td>
                    </tr>`;
                });
            }
        });

        let lignesVerif = "";
        config.materielAVerifier.forEach(item => {
            lignesVerif += `<tr>
                <td data-label="Produit :" style="text-align:left;">${esc(item.nom)}</td>
                <td data-label="Référence :">${esc(item.ref)}</td>
                <td data-label="Présent :"><input type="checkbox" style="width:20px; height:20px; margin:0;"></td>
            </tr>`;
        });

        if (!lignes) {
            lignes = `<tr><td colspan="4" style="padding:20px; color:#90A4AE;">Aucun médecin n'a de saisie supérieure à 0.</td></tr>`;
        }

        container.innerHTML = `
            <div class="card" style="max-width: 800px; padding: 30px;">
                <h2>Bon de Commande IVT</h2>

                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 10px;">
                    <p style="font-size: 0.9rem; color: #78909C; font-style: italic; margin: 0;">Édité le ${esc(dateAffichage)}</p>
                    <button id="btn-toggle-cond" onclick="toggleConditionnement()" class="no-print" style="width: auto; padding: 8px 15px; font-size: 0.85rem; margin: 0;">👁️ Afficher Conditionnement</button>
                </div>

                <table class="commande-table hide-cond" id="table-commande">
                    <thead>
                        <tr>
                            <th>Produit</th>
                            <th>Référence</th>
                            <th>Quantité à commander</th>
                            <th class="col-cond">Conditionnement</th>
                        </tr>
                    </thead>
                    <tbody>${lignes}</tbody>
                </table>

                <h3 class="saut-de-page" style="margin-top:35px; color:#D32F2F; border-bottom: 2px solid #FFEBEE;">⚠️ À vérifier en stock (Dotation)</h3>

                <table class="commande-table" style="margin-bottom:30px;">
                    <thead><tr style="background:#D32F2F"><th>Produit</th><th>Référence</th><th>Présent</th></tr></thead>
                    <tbody>${lignesVerif}</tbody>
                </table>

                <div class="no-print" style="display:flex; gap:10px; flex-wrap: wrap;">
                    <button onclick="window.print()" style="flex:1; min-width: 100%;">🖨️ IMPRIMER</button>
                    <button onclick="exporterExcel()" class="btn-vert" style="flex:1; min-width: 100%;">📊 GÉNÉRATION EXCEL</button>
                    <button onclick="reinitialiserSaisie()" class="btn-gris" style="flex:1; min-width: 100%;">🔄 RÉ-INITIALISER</button>
                </div>
            </div>`;
    }

    function exporterExcel() {
        if (typeof XLSX === 'undefined') { alert("La librairie Excel n'est pas disponible."); return; }
        let dataForExcel = [["Famille", "Produit", "Référence", "Quantité à commander", "Conditionnement"]];
        let familleActuelle = "";
        donneesCommandeFinale.forEach(row => {
            let affichageFamille = row.famille !== familleActuelle ? row.famille : "";
            familleActuelle = row.famille;
            dataForExcel.push([affichageFamille, row.nom, row.ref, row.qteTotal, row.conditionnement]);
        });
        const worksheet = XLSX.utils.aoa_to_sheet(dataForExcel);
        worksheet['!cols'] = [{ wch: 25 }, { wch: 35 }, { wch: 15 }, { wch: 22 }, { wch: 20 }];
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Commande IVT");
        XLSX.writeFile(workbook, `Commande IVT ${obtenirDateFichier()}.xlsx`);
    }

    /* ==================================================================
       PARAMÈTRES
       ================================================================== */
    function basculerParametres() {
        if (vueCourante === 'parametres') {
            formActif = null;
            redisplay(vueAvantParam);
        } else {
            vueAvantParam = vueCourante;
            formActif = null;
            afficherParametres();
        }
    }

    function allerSection(section) { sectionParam = section; formActif = null; afficherParametres(); }

    function navBtn(id, label) {
        return `<button class="${sectionParam === id ? 'actif' : ''}" onclick="allerSection('${id}')">${label}</button>`;
    }

    function afficherParametres() {
        vueCourante = 'parametres';
        const container = document.getElementById('app-container');
        let contenu = '';
        if (sectionParam === 'materiel') sectionParam = 'parMedecin';
        if (sectionParam === 'medecins') contenu = vueMedecins();
        else if (sectionParam === 'parMedecin') contenu = vueParMedecin();
        else if (sectionParam === 'dotation') contenu = vueDotation();
        else contenu = vueSauvegarde();

        container.innerHTML = `
            <div class="card" style="max-width: 800px;">
                <h2>⚙️ Paramètres</h2>
                <div class="param-nav">
                    ${navBtn('medecins', '👨‍⚕️ Médecins')}
                    ${navBtn('parMedecin', '🧪 Matériel par médecin')}
                    ${navBtn('dotation', '⚠️ Dotation')}
                    ${navBtn('sauvegarde', '💾 Sauvegarde')}
                </div>
                <div class="aide" id="ligne-version" style="text-align:right; margin-top:-4px;">Version : ${Array.isArray(VERSION_MODELE) ? 'modèle' : 'clinique'}</div>
                ${contenu}
                <button onclick="basculerParametres()" class="btn-gris" style="margin-top: 20px;">⬅ RETOUR À L'APPLICATION</button>
            </div>`;
        majLigneVersion();
    }

    function majLigneVersion() {
        const type = Array.isArray(VERSION_MODELE) ? 'modèle' : 'clinique';
        fetch('sw.js?u=' + Date.now(), { cache: 'no-store' })
            .then(r => (r.ok ? r.text() : ''))
            .then(txt => {
                const m = (txt || '').match(/commande-ivt-v\d+/);
                const dispo = m ? m[0] : '';
                const e = document.getElementById('ligne-version');
                if (e) {
                    e.textContent = 'Version : ' + type + ' — ' + (dispo || VERSION_APPLI) +
                        (dispo && dispo !== VERSION_APPLI ? ' (page ' + VERSION_APPLI + ')' : '');
                }
                if (dispo && dispo !== VERSION_APPLI) afficherBanniereMaj(dispo);
                else masquerBanniereMaj();
            })
            .catch(() => {});
    }

    function afficherBanniereMaj(v) {
        let b = document.getElementById('banniere-maj');
        if (!b) {
            b = document.createElement('div');
            b.id = 'banniere-maj';
            b.style.cssText = 'position:fixed;left:10px;right:10px;bottom:10px;z-index:9999;background:#1565C0;color:#fff;' +
                'padding:12px 14px;border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.35);display:flex;gap:10px;' +
                'align-items:center;justify-content:space-between;font-size:15px;';
            b.innerHTML = '<span id="banniere-maj-texte"></span>' +
                '<button id="banniere-maj-btn" style="background:#fff;color:#1565C0;border:0;border-radius:8px;padding:9px 14px;font-weight:bold;cursor:pointer;">🔄 RECHARGER</button>';
            document.body.appendChild(b);
            document.getElementById('banniere-maj-btn').addEventListener('click', () => window.location.reload());
        }
        document.getElementById('banniere-maj-texte').textContent = 'Mise à jour disponible (' + v + ')';
        b.style.display = 'flex';
    }

    function masquerBanniereMaj() {
        const b = document.getElementById('banniere-maj');
        if (b) b.style.display = 'none';
    }

    /* ---------- Formulaire article ---------- */
    function formArticle(pre, a) {
        a = a || { nom: '', ref: '', qte: 1, famille: '', cond: 1, unite: 'boîte', fixe: false };
        const uniteCourante = a.unite || 'boîte';
        const unites = config.unites.slice();
        if (unites.indexOf(uniteCourante) === -1) unites.push(uniteCourante);
        return `
        <div class="form-grid">
            <label class="champ">Nom *<input type="text" id="${pre}-nom" value="${esc(a.nom)}" placeholder="Ex. Bétadine Opht 20ml"></label>
            <label class="champ">Référence<input type="text" id="${pre}-ref" value="${esc(a.ref)}" placeholder="Ex. 1548498"></label>
            <label class="champ">Quantité (par IVT)<input type="number" id="${pre}-qte" min="0" value="${a.qte}"></label>
            <label class="champ">Conditionnement (par)<input type="number" id="${pre}-cond" min="1" value="${a.cond}"></label>
            <label class="champ">Famille<input type="text" id="${pre}-famille" list="liste-familles" value="${esc(a.famille)}"></label>
            <label class="champ">Unité<select id="${pre}-unite" onchange="changerUnite(this)">${unites.map(u => `<option value="${esc(u)}" ${u === uniteCourante ? 'selected' : ''}>${esc(u)}</option>`).join('')}<option value="__autre__">➕ Autre unité…</option></select></label>
        </div>
        <label class="champ case-fixe"><input type="checkbox" id="${pre}-fixe" ${a.fixe ? 'checked' : ''}> Quantité fixe (non multipliée par le nombre d'IVT)</label>
        <datalist id="liste-familles">${config.familles.map(f => `<option value="${esc(f)}">`).join('')}</datalist>`;
    }

    function changerUnite(select) {
        if (select.value !== '__autre__') { select.dataset.avant = select.value; return; }
        const u = (prompt('Nouvelle unité :') || '').trim();
        if (u) {
            if (config.unites.indexOf(u) === -1) { config.unites.push(u); sauverConfig(); }
            select.value = u;
            select.dataset.avant = u;
        } else {
            select.value = select.dataset.avant || 'boîte';
        }
    }

    function assurerOptionUnite(select, unite) {
        if (!select || !unite) return;
        if (!Array.prototype.some.call(select.options, o => o.value === unite)) {
            const opt = document.createElement('option');
            opt.value = unite;
            opt.textContent = unite;
            const autre = select.querySelector('option[value="__autre__"]');
            if (autre) select.insertBefore(opt, autre); else select.appendChild(opt);
        }
        select.value = unite;
    }

    function lireArticle(pre) {
        const nom = val(pre + '-nom').trim();
        if (!nom) { alert("Le nom de l'article est obligatoire."); return null; }
        const fixe = coche(pre + '-fixe');
        const qte = num(pre + '-qte');
        const cond = Math.max(1, num(pre + '-cond') || 1);
        return {
            nom: nom,
            ref: val(pre + '-ref').trim(),
            qte: qte,
            cond: cond,
            famille: val(pre + '-famille').trim() || 'Divers',
            unite: val(pre + '-unite').trim() || 'boîte',
            fixe: fixe
        };
    }

    function boutonsFormulaire(onSave, onAnnuler) {
        return `<div class="ligne-form"><button onclick="${onSave}">✅ ENREGISTRER</button><button onclick="${onAnnuler}" class="btn-annuler">✖ ANNULER</button></div>`;
    }

    /* ---------- Section : Médecins ---------- */
    function vueMedecins() {
        let html = '<div class="sous-titre">Liste des médecins (' + config.medecins.length + ')</div>';
        if (!config.medecins.length) html += '<div class="vide">Aucun médecin. Ajoutez-en un ci-dessous.</div>';

        config.medecins.forEach(m => {
            if (formActif && formActif.type === 'medecin' && formActif.id === m.id) {
                html += `
                <div class="form-zone">
                    <h4>✏️ Modifier "${esc(m.nom)}"</h4>
                    <div class="form-grid">
                        <label class="champ">Nom du médecin *<input type="text" id="md-nom" value="${esc(m.nom)}"></label>
                        <label class="champ">Couleur<input type="color" id="md-couleur" value="${esc(m.couleur)}"></label>
                    </div>
                    ${boutonsFormulaire(`modifierMedecin('${m.id}')`, 'annulerFormulaire()')}
                </div>`;
            } else {
                html += `
                <div class="item-ligne">
                    <span class="pastille" style="background:${esc(m.couleur)}"></span>
                    <div class="item-corps">
                        <div class="item-nom">${esc(m.nom)}</div>
                        <div class="item-meta">${compteursIVT[m.id] || 0} IVT saisis · ${articlesDuMedecin(m.id).length} article(s) de matériel</div>
                    </div>
                    <button class="icon-btn" title="Modifier" onclick="editerMedecin('${m.id}')">✏️</button>
                    <button class="icon-btn danger" title="Supprimer" onclick="supprimerMedecin('${m.id}')">🗑️</button>
                </div>`;
            }
        });

        if (!(formActif && formActif.type === 'medecin')) {
            html += `
            <div class="form-zone">
                <h4>➕ Ajouter un médecin</h4>
                <div class="form-grid">
                    <label class="champ">Nom du médecin *<input type="text" id="md-nom" placeholder="Ex. Dr Dupont"></label>
                    <label class="champ">Couleur<input type="color" id="md-couleur" value="#0288D1"></label>
                </div>
                <div class="ligne-form"><button onclick="ajouterMedecin()">➕ AJOUTER</button></div>
            </div>`;
        }
        html += '<p class="aide">La couleur sert à identifier le médecin dans le récapitulatif. Supprimer un médecin efface aussi sa saisie et son matériel.</p>';
        return html;
    }

    function editerMedecin(id) { formActif = { type: 'medecin', id: id }; afficherParametres(); }
    function annulerFormulaire() { formActif = null; afficherParametres(); }

    function ajouterMedecin() {
        const nom = val('md-nom').trim();
        if (!nom) { alert("Le nom du médecin est obligatoire."); return; }
        const couleur = val('md-couleur') || '#0288D1';
        const id = slugUnique(config.medecins, nom);
        config.medecins.push({ id: id, nom: nom, couleur: couleur });
        sauverConfig();
        afficherParametres();
    }

    function modifierMedecin(id) {
        const m = medecinParId(id);
        if (!m) return;
        const nom = val('md-nom').trim();
        if (!nom) { alert("Le nom du médecin est obligatoire."); return; }
        m.nom = nom;
        m.couleur = val('md-couleur') || m.couleur;
        sauverConfig();
        formActif = null;
        afficherParametres();
    }

    function supprimerMedecin(id) {
        const m = medecinParId(id);
        if (!m) return;
        if (config.medecins.length <= 1) { alert("Il doit rester au moins un médecin."); return; }
        if (!confirm(`Supprimer ${m.nom} ?\n\nSa saisie (nombre d'IVT) et sa liste de matériel seront également supprimés.`)) return;
        config.medecins = config.medecins.filter(x => x.id !== id);
        delete config.materielSpecifique[id];
        delete compteursIVT[id];
        sauverSaisie();
        if (medecinSelectionne === id) medecinSelectionne = null;
        if (indexMedecinActuel > config.medecins.length) indexMedecinActuel = config.medecins.length;
        sauverConfig();
        formActif = null;
        afficherParametres();
    }

    /* ---------- Section : Matériel par médecin ---------- */
    function vueParMedecin() {
        let html = '<div class="sous-titre">Matériel complet d\'un médecin</div>';
        html += '<p class="aide">Chaque médecin possède sa <b>propre liste complète</b> : c\'est elle qui sert au bon de commande. Ajoutez, modifiez ou supprimez librement les articles.</p>';

        html += '<div class="chips">' + config.medecins.map(m =>
            `<button class="${medecinSelectionne === m.id ? 'actif' : ''}" onclick="selectionnerMedecin('${m.id}')">${esc(m.nom)}</button>`
        ).join('') + '</div>';

        if (!medecinSelectionne || !medecinParId(medecinSelectionne)) {
            html += '<div class="vide">Sélectionnez un médecin pour gérer son matériel.</div>';
            return html;
        }

        const m = medecinParId(medecinSelectionne);
        const articles = articlesDuMedecin(medecinSelectionne);
        html += `<div class="sous-titre" style="color:${esc(m.couleur)}">🧪 ${esc(m.nom)} — ${articles.length} article(s)</div>`;

        if (!articles.length) html += '<div class="vide">Aucun article pour ce médecin. Ajoutez-en un ci-dessous.</div>';

        articles.forEach(a => {
            if (formActif && formActif.type === 'medArticle' && formActif.uid === a.uid) {
                html += `
                <div class="form-zone">
                    <h4>✏️ Modifier l'article</h4>
                    ${formArticle('pme', a)}
                    ${boutonsFormulaire(`modifierArticleMed('${a.uid}')`, 'annulerFormulaire()')}
                </div>`;
            } else {
                html += `
                <div class="item-ligne">
                    <div class="item-corps">
                        <div class="item-nom">${esc(a.nom)} <span class="famille">· ${esc(a.famille)}</span></div>
                        <div class="item-meta">Réf ${esc(a.ref) || '—'} · qté ${a.qte}/IVT · cond. ${a.cond} ${esc(a.unite)} ${a.fixe ? '<span class="icone-fixe">FIXE</span>' : ''}</div>
                    </div>
                    <button class="icon-btn" title="Modifier" onclick="editerArticleMed('${a.uid}')">✏️</button>
                    <button class="icon-btn danger" title="Supprimer" onclick="supprimerArticleMed('${a.uid}')">🗑️</button>
                </div>`;
            }
        });

        if (!(formActif && formActif.type === 'medArticle')) {
            const catalogue = catalogueArticles();
            html += `
            <div class="form-zone">
                <h4>➕ Ajouter un article pour ${esc(m.nom)}</h4>
                ${catalogue.length ? `
                <label class="champ">Tout le matériel (sinon saisie libre)
                    <select onchange="prefillerArticleMed(this.value)">
                        <option value="">— Saisie libre —</option>
                        ${catalogue.map((a, i) => `<option value="${i}">${esc(a.nom)}${a.ref ? ' — ' + esc(a.ref) : ''}</option>`).join('')}
                    </select>
                </label>
                <div style="height:10px"></div>` : ''}
                ${formArticle('pm', null)}
                <div class="ligne-form"><button onclick="ajouterArticleMed()">➕ AJOUTER</button></div>
            </div>`;
        }
        return html;
    }

    function selectionnerMedecin(id) { medecinSelectionne = id; formActif = null; afficherParametres(); }

    function catalogueArticles() {
        const liste = [];
        const ajouter = a => {
            if (!a || !a.nom) return;
            if (!liste.some(x => x.nom === a.nom && (x.ref || '') === (a.ref || ''))) liste.push(a);
        };
        (config.materielCatalogue || []).forEach(ajouter);
        Object.keys(config.materielSpecifique || {}).forEach(id => (config.materielSpecifique[id] || []).forEach(ajouter));
        (config.materielBase || []).forEach(ajouter);
        return liste;
    }

    function prefillerArticleMed(cle) {
        const i = Number(cle);
        const a = (cle === '' || !Number.isInteger(i) || i < 0) ? null : (catalogueArticles()[i] || null);
        const set = (id, v) => { const e = document.getElementById(id); if (e) e.value = v; };
        const cb = document.getElementById('pm-fixe');
        if (!a) {
            set('pm-nom', ''); set('pm-ref', ''); set('pm-qte', 1); set('pm-cond', 1);
            set('pm-famille', ''); set('pm-unite', 'boîte');
            if (cb) cb.checked = false;
            return;
        }
        set('pm-nom', a.nom); set('pm-ref', a.ref); set('pm-qte', a.qte);
        set('pm-cond', a.cond); set('pm-famille', a.famille);
        assurerOptionUnite(document.getElementById('pm-unite'), a.unite);
        if (cb) cb.checked = !!a.fixe;
    }

    function ajouterArticleMed() {
        if (!medecinSelectionne) { alert("Sélectionnez d'abord un médecin."); return; }
        const a = lireArticle('pm');
        if (!a) return;
        a.uid = uid();
        ajouterFamille(a.famille); ajouterUnite(a.unite);
        if (!config.materielSpecifique[medecinSelectionne]) config.materielSpecifique[medecinSelectionne] = [];
        config.materielSpecifique[medecinSelectionne].push(a);
        if (!config.materielCatalogue.some(x => x.nom === a.nom && (x.ref || '') === (a.ref || ''))) {
            config.materielCatalogue.push(Object.assign({}, a, { uid: uid() }));
        }
        sauverConfig();
        afficherParametres();
    }
    function editerArticleMed(u) { formActif = { type: 'medArticle', uid: u }; afficherParametres(); }
    function modifierArticleMed(u) {
        const a = articlesDuMedecin(medecinSelectionne).find(x => x.uid === u);
        if (!a) return;
        const data = lireArticle('pme');
        if (!data) return;
        Object.assign(a, data);
        ajouterFamille(a.famille); ajouterUnite(a.unite);
        sauverConfig();
        formActif = null;
        afficherParametres();
    }
    function supprimerArticleMed(u) {
        const a = articlesDuMedecin(medecinSelectionne).find(x => x.uid === u);
        if (!a) return;
        if (!confirm(`Retirer "${a.nom}" du matériel de ce médecin ?`)) return;
        config.materielSpecifique[medecinSelectionne] = articlesDuMedecin(medecinSelectionne).filter(x => x.uid !== u);
        sauverConfig();
        formActif = null;
        afficherParametres();
    }

    /* ---------- Section : Dotation (à vérifier en stock) ---------- */
    function vueDotation() {
        let html = '<div class="sous-titre">Liste "à vérifier en stock" (' + config.materielAVerifier.length + ')</div>';
        if (!config.materielAVerifier.length) html += '<div class="vide">Aucun article.</div>';

        config.materielAVerifier.forEach(a => {
            if (formActif && formActif.type === 'dotation' && formActif.uid === a.uid) {
                html += `
                <div class="form-zone">
                    <h4>✏️ Modifier l'article</h4>
                    <div class="form-grid">
                        <label class="champ">Nom *<input type="text" id="dve-nom" value="${esc(a.nom)}"></label>
                        <label class="champ">Référence<input type="text" id="dve-ref" value="${esc(a.ref)}"></label>
                    </div>
                    ${boutonsFormulaire(`modifierDotation('${a.uid}')`, 'annulerFormulaire()')}
                </div>`;
            } else {
                html += `
                <div class="item-ligne">
                    <div class="item-corps">
                        <div class="item-nom">${esc(a.nom)}</div>
                        <div class="item-meta">Réf ${esc(a.ref) || '—'}</div>
                    </div>
                    <button class="icon-btn" title="Modifier" onclick="editerDotation('${a.uid}')">✏️</button>
                    <button class="icon-btn danger" title="Supprimer" onclick="supprimerDotation('${a.uid}')">🗑️</button>
                </div>`;
            }
        });

        if (!(formActif && formActif.type === 'dotation')) {
            html += `
            <div class="form-zone">
                <h4>➕ Ajouter un article à vérifier</h4>
                <div class="form-grid">
                    <label class="champ">Nom *<input type="text" id="dv-nom" placeholder="Ex. Compresses Ophta (2 Boîtes)"></label>
                    <label class="champ">Référence<input type="text" id="dv-ref" placeholder="Ex. 1051069"></label>
                </div>
                <div class="ligne-form"><button onclick="ajouterDotation()">➕ AJOUTER</button></div>
            </div>`;
        }
        html += '<p class="aide">Cette liste apparaît dans le bon de commande sous "⚠️ À vérifier en stock (Dotation)".</p>';
        return html;
    }

    function editerDotation(u) { formActif = { type: 'dotation', uid: u }; afficherParametres(); }
    function ajouterDotation() {
        const nom = val('dv-nom').trim();
        if (!nom) { alert("Le nom est obligatoire."); return; }
        config.materielAVerifier.push({ uid: uid(), nom: nom, ref: val('dv-ref').trim() });
        sauverConfig(); afficherParametres();
    }
    function modifierDotation(u) {
        const a = config.materielAVerifier.find(x => x.uid === u);
        if (!a) return;
        const nom = val('dve-nom').trim();
        if (!nom) { alert("Le nom est obligatoire."); return; }
        a.nom = nom; a.ref = val('dve-ref').trim();
        sauverConfig(); formActif = null; afficherParametres();
    }
    function supprimerDotation(u) {
        const a = config.materielAVerifier.find(x => x.uid === u);
        if (!a) return;
        if (!confirm(`Supprimer "${a.nom}" de la liste de dotation ?`)) return;
        config.materielAVerifier = config.materielAVerifier.filter(x => x.uid !== u);
        sauverConfig(); formActif = null; afficherParametres();
    }

    /* ---------- Section : Sauvegarde ---------- */
    function vueSauvegarde() {
        return `
        <div class="sous-titre">📤 Exporter la configuration</div>
        <p class="aide">Téléverse un fichier <b>configuration-ivt.json</b> contenant médecins, matériel et dotation. À importer sur un autre téléphone pour avoir exactement les mêmes réglages.</p>
        <button onclick="exporterConfiguration()" class="btn-vert">📤 EXPORTER LA CONFIGURATION</button>

        <div class="sous-titre">📥 Importer une configuration</div>
        <p class="aide">Remplace <b>entièrement</b> la configuration actuelle par celle du fichier choisi. La saisie (nombre d'IVT) n'est pas touchée.</p>
        <label class="champ" style="margin-bottom:12px;">
            <input type="file" id="fichier-config" accept="application/json,.json" onchange="importerConfiguration(this.files[0])" style="border:2px dashed #B3E5FC; padding:12px; border-radius:8px; background:#fff;">
        </label>

        <div class="sous-titre">♻️ Réinitialiser</div>
        <p class="aide">Restaure la configuration d'origine (5 médecins, matériel par défaut).</p>
        <button onclick="reinitialiserConfiguration()" class="btn-danger">♻️ RÉINITIALISER LA CONFIGURATION</button>`;
    }

    function exporterConfiguration() {
        try {
            const contenu = JSON.stringify(config, null, 2);
            const blob = new Blob([contenu], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'configuration-ivt.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(a.href), 5000);
        } catch (e) { alert("Export impossible : " + e); }
    }

    function importerConfiguration(fichier) {
        if (!fichier) return;
        const lecteur = new FileReader();
        lecteur.onload = () => {
            try {
                const objet = JSON.parse(lecteur.result);
                const valide = objet && Array.isArray(objet.medecins) &&
                    (Array.isArray(objet.materielBase) || (objet.materielSpecifique && typeof objet.materielSpecifique === 'object'));
                if (!valide) {
                    alert("Fichier invalide : ce n'est pas une configuration Commande IVT.");
                    return;
                }
                if (!confirm(`Importer la configuration de ${objet.medecins.length} médecin(s) ?\n\nLa configuration actuelle sera remplacée.`)) return;
                config = migrerConfig(objet);
                sauverConfig();
                medecinSelectionne = null;
                formActif = null;
                if (indexMedecinActuel > config.medecins.length) indexMedecinActuel = config.medecins.length;
                afficherParametres();
                alert("Configuration importée avec succès.");
            } catch (e) {
                alert("Fichier illisible : " + e);
            }
        };
        lecteur.readAsText(fichier);
    }

    function reinitialiserConfiguration() {
        if (!confirm("Réinitialiser toute la configuration (médecins, matériel, dotation) aux valeurs d'origine ?\n\nLa saisie des IVT est conservée.")) return;
        config = migrerConfig(configParDefaut());
        sauverConfig();
        medecinSelectionne = null;
        formActif = null;
        if (indexMedecinActuel > config.medecins.length) indexMedecinActuel = config.medecins.length;
        afficherParametres();
    }

    /* ==================================================================
       SERVICE WORKER
       ================================================================== */
    if ('serviceWorker' in navigator) {
        if (navigator.serviceWorker.controller) {
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!window.__rechargeSW) { window.__rechargeSW = true; window.location.reload(); }
            });
        }
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').catch(err => console.warn('Service Worker: ' + err));
        });

        /* Vérifie régulièrement s'il existe une version plus récente */
        const verifierMaj = () => {
            majLigneVersion();
            if (navigator.serviceWorker.getRegistration) {
                navigator.serviceWorker.getRegistration().then(r => { if (r) r.update(); }).catch(() => {});
            }
        };
        window.addEventListener('load', () => setTimeout(verifierMaj, 3000));
        setInterval(verifierMaj, 5 * 60 * 1000);
        document.addEventListener('visibilitychange', () => { if (!document.hidden) verifierMaj(); });
    }
</script>
</body>
</html>
